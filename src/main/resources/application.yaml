spring:
  application:
    name: ms-account
  data:
    redis:
      host: localhost
      port: 6379

core-banking:
  base-url: http://localhost:3001

cache:
  account-balance:
    ttl: 60s

resilience4j:
  circuitbreaker:
    instances:
      coreBanking:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  retry:
    instances:
      coreBanking:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: false
    metrics:
      enabled: true
  timelimiter:
    instances:
      coreBankingTl:
        timeoutDuration: 1s
        cancelRunningFuture: true
  ratelimiter:
    instances:
      backendService: # nombre lógico del RateLimiter
        limit-for-period: 2 # número máximo de llamadas permitidas por periodo
        limit-refresh-period: 50s # duración del periodo
        timeout-duration: 2s # cuánto esperar para adquirir un permiso
        registerHealthIndicator: true # expone estado en actuator/health

management:
  health:
    redis:
      enabled: false
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, circuitbreakerevents, retries, retryevents

server:
  port: 9092

logging:
  level:
    io.github.resilience4j.ratelimiter: DEBUG
    io.github.resilience4j.timelimiter: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG
    io.github.resilience4j.retry: DEBUG
